  <path d="M 42 42 L 48 52" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 26 44 L 22 56" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
