[project]
name = "crabai-api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Z User", email = "z@container" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-nvidia-ai-endpoints>=1.0.0",
    "langchain-cloudflare>=0.4.1",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.12.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.44.0",
]

[project.scripts]
crabai-api = "crabai_api:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
