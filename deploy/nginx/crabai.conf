# crabAI — nginx production config
#
# Architecture:
#   nginx (80/443) ─┬─> serves Vue static files from /var/www/crabai
#                  └─> proxies /api/* to FastAPI on 127.0.0.1:8000
#
# Setup:
#   1. Copy to /etc/nginx/sites-available/crabai.conf
#   2. ln -s /etc/nginx/sites-available/crabai.conf /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#
# Replace CRABAI_DOMAIN with your real domain (e.g. crabai.example.com).

# Rate limit zone — protects the /api/* endpoints from abuse.
# 10 req/sec per IP, burst of 20.
limit_req_zone $binary_remote_addr zone=crabai_api:10m rate=10r/s;

# Upstream for the FastAPI backend.
upstream crabai_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP → HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name CRABAI_DOMAIN www.CRABAI_DOMAIN;

    # ACME challenge path for certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Permanent redirect to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name CRABAI_DOMAIN www.CRABAI_DOMAIN;

    # --- SSL certs (managed by certbot — run `certbot --nginx` first) ---
    ssl_certificate     /etc/letsencrypt/live/CRABAI_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CRABAI_DOMAIN/privkey.pem;

    # Modern TLS — only 1.2 and 1.3.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: allow self + the Z.ai CDN (for the favicon). Tighten further if you
    # don't need the CDN.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self'; frame-ancestors 'self'" always;

    # --- Max upload size — for /api/documents/upload (PDFs).
    # Default 10MB. Increase if your PDFs are larger.
    client_max_body_size 10M;

    # --- Gzip the Vue JS/CSS bundles ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/xml+rss image/svg+xml;

    # --- API proxy to FastAPI ---
    location /api/ {
        limit_req zone=crabai_api burst=20 nodelay;

        proxy_pass http://crabai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket/SSE support — needed for /api/*/chat/stream endpoints.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE needs buffering disabled so tokens stream through immediately.
        proxy_buffering off;
        proxy_cache off;

        # Long-running agent calls (RAG + SQL + supervisor synthesis).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Vue static files ---
    root /var/www/crabai;
    index index.html;

    location / {
        # SPA fallback — Vue Router uses history mode, so unknown paths
        # should serve index.html (not a 404).
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed assets (Vite emits filename-<hash>.js).
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No cache for index.html (so users always get the latest entry point).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
